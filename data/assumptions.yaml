# 시뮬레이션 가정값
#
# 여기 있는 모든 숫자는 "가정"이다. 심사·발표에서 근거를 물을 수 있으므로
# 값을 추가하거나 바꿀 때는 반드시 source 주석을 함께 남긴다.
# 이 파일은 core/assumptions.py 를 통해서만 읽는다.

version: "2026-08-13"

# ---------------------------------------------------------------------------
# 거시 가정
# ---------------------------------------------------------------------------
macro:
  # 물가상승률 — 생활비를 매년 이 비율로 증가시킨다.
  # source: 한국은행 물가안정목표 2.0% + 최근 10년 소비자물가 상승률 평균을 반영한 보수적 값
  inflation_rate: 0.023

  # 시뮬레이션 종료 나이. 통계청 기대여명 대비 보수적으로 길게 잡는다.
  # source: 통계청 생명표 기준 60세 남성 기대여명 + 안전마진
  horizon_age: 95

# ---------------------------------------------------------------------------
# 자산군별 기대수익률 / 변동성 (연율, 명목)
#   expected_return: 결정론적 시뮬레이션에서 사용
#   volatility     : 몬테카를로(W2)에서 사용
# ---------------------------------------------------------------------------
asset_classes:
  cash:
    label: "현금성(예적금·MMF)"
    expected_return: 0.030 # source: 시중은행 1년 정기예금 금리 수준
    volatility: 0.004
  bond:
    label: "채권·중위험"
    expected_return: 0.038 # source: 국고채 3년 + 신용스프레드 근사
    volatility: 0.045
  equity:
    label: "주식·ETF·펀드"
    expected_return: 0.070 # source: 글로벌 주식 장기 명목수익률 보수 추정
    volatility: 0.170

# ---------------------------------------------------------------------------
# 세금 — MVP는 실효세율 근사만 사용한다 (정밀 계산은 범위 밖, 화면에 참고용 고지 필수)
# ---------------------------------------------------------------------------
tax:
  # 이자·배당소득 원천징수 실효세율 (소득세 14% + 지방소득세 1.4%)
  # source: 소득세법 제129조
  financial_income_rate: 0.154

  # 금융소득종합과세 기준금액. 초과분에 대한 누진 효과는 MVP에서 반영하지 않는다.
  # source: 소득세법 제14조
  comprehensive_threshold: 20000000

# ---------------------------------------------------------------------------
# 건강보험료 — 지역가입자 소득분 근사. 정밀 산정(재산점수 등)은 범위 밖.
# ---------------------------------------------------------------------------
health_insurance:
  # 금융소득에 부과되는 실효 부담률 근사 (건강보험료율 + 장기요양보험료 포함)
  # source: 국민건강보험법 시행령 보험료율 기준 근사
  effective_rate_on_financial_income: 0.080

  # 이 금액 이하의 연간 금융소득에는 부과하지 않는다.
  # source: 건강보험료 부과 대상 금융소득 기준
  exemption_threshold: 10000000

# ---------------------------------------------------------------------------
# 연금
# ---------------------------------------------------------------------------
pension:
  # 출생연도별 국민연금 노령연금 수급 개시 연령 (법정 스케줄).
  # from_birth_year 이상인 구간의 age 를 적용한다.
  # source: 국민연금법 부칙 제8조 (수급연령 단계적 상향)
  start_age_schedule:
    - { from_birth_year: 0, age: 60 }
    - { from_birth_year: 1953, age: 61 }
    - { from_birth_year: 1957, age: 62 }
    - { from_birth_year: 1961, age: 63 }
    - { from_birth_year: 1965, age: 64 }
    - { from_birth_year: 1969, age: 65 }

  # 국민연금 수령액의 물가연동 여부. 실제로 국민연금은 물가에 연동된다.
  # source: 국민연금법 제51조의2
  indexed_to_inflation: true

  # 수급 시기를 법정 개시연령에서 앞당기거나 미룰 때의 수령액 조정률.
  # 소득공백기 문제에 대한 가장 직접적인 레버라서 처방 엔진(core/prescribe.py)이 쓴다.
  #
  # 연기연금: 1개월당 0.6% 가산 = 연 7.2%, 최대 5년(36%)
  #   source: 국민연금법 제62조(연기연금) — 시행령 원문으로 재확인할 것
  # 조기노령연금: 1년당 6% 감액, 최대 5년(30%)
  #   source: 국민연금법 제61조(조기노령연금) — 시행령 원문으로 재확인할 것
  #
  # ⚠️ 조기 수령의 감액은 평생 유지된다. 화면에서 이 점을 반드시 함께 말해야 한다.
  deferral_rate_per_year: 0.072
  early_rate_per_year: 0.060
  max_adjust_years: 5

# ---------------------------------------------------------------------------
# 퇴직소득세 — 퇴직금을 일시금으로 받을지 연금으로 받을지 비교하는 데 쓴다.
#
# 이 서비스에서 유일하게 "실효세율 근사"가 아니라 **제도의 계산 구조를 그대로**
# 따라가는 세금이다. 퇴직소득세는 근속연수공제가 매우 커서 실효세율이 1~5%로
# 낮은데, 평균 세율 하나로 뭉개면 "장기근속자는 퇴직소득세가 거의 없다"는
# 중요한 사실이 사라진다. 타겟(30년 안팎 근속 후 퇴직)에게는 그게 핵심이다.
#
# 계산 순서 (소득세법 제48조·제55조):
#   환산급여 = (퇴직급여 - 근속연수공제) ÷ 근속연수 × 12
#   과세표준 = 환산급여 - 환산급여공제
#   산출세액 = 과세표준 × 기본세율 ÷ 12 × 근속연수   (연분연승법)
#
# ⚠️ 아래 구간·금액은 **원문(소득세법 및 시행령)으로 반드시 재확인할 것.**
#    발표에서 이 표를 그대로 띄우게 된다.
# ---------------------------------------------------------------------------
retirement_income_tax:
  # 근속연수공제 — 구간별 기본공제액 + 초과 1년당 가산액 (원)
  # source: 소득세법 제48조 제1항
  service_deduction:
    - { over_years: 0, base: 0, per_year: 1_000_000 }
    - { over_years: 5, base: 5_000_000, per_year: 2_000_000 }
    - { over_years: 10, base: 15_000_000, per_year: 2_500_000 }
    - { over_years: 20, base: 40_000_000, per_year: 3_000_000 }

  # 환산급여공제 — 구간별 기본공제액 + 초과분 공제율
  # source: 소득세법 제48조 제3항
  converted_deduction:
    - { over: 0, base: 0, rate: 1.00 }
    - { over: 8_000_000, base: 8_000_000, rate: 0.60 }
    - { over: 70_000_000, base: 45_200_000, rate: 0.55 }
    - { over: 100_000_000, base: 61_700_000, rate: 0.45 }
    - { over: 300_000_000, base: 151_700_000, rate: 0.35 }

  # 종합소득 기본세율 (누진). 퇴직소득세도 이 세율표를 쓴다.
  # source: 소득세법 제55조
  brackets:
    - { over: 0, rate: 0.06 }
    - { over: 14_000_000, rate: 0.15 }
    - { over: 50_000_000, rate: 0.24 }
    - { over: 88_000_000, rate: 0.35 }
    - { over: 150_000_000, rate: 0.38 }
    - { over: 300_000_000, rate: 0.40 }
    - { over: 500_000_000, rate: 0.42 }
    - { over: 1_000_000_000, rate: 0.45 }

  # 지방소득세 (소득세액의 10%)
  # source: 지방세법 제92조
  local_tax_rate: 0.10

  # IRP 등으로 연금 수령 시 퇴직소득세 감면율.
  # 수령 10년차까지 30%, 11년차부터 40% 감면된다.
  # source: 소득세법 제129조 제1항 제5호의3
  pension_discount: 0.30
  pension_discount_after: 0.40
  pension_discount_after_years: 10

  # 연금으로 받을 때의 기본 수령 기간(년). 화면에서 조정할 수 있다.
  default_pension_years: 10

# ---------------------------------------------------------------------------
# 민감도 분석 — 이 가정들이 틀렸을 때 결과가 얼마나 흔들리는지 보여준다.
#
# 심사·발표에서 "그 가정이 틀리면요?"는 반드시 나오는 질문이다. 답을 준비하는
# 것보다 **화면에 미리 띄워두는 편**이 낫다. 여기 값은 "얼마나 틀릴 수 있는가"의
# 폭이며, 가정값 자체와 마찬가지로 근거가 필요하다.
# ---------------------------------------------------------------------------
sensitivity:
  # 물가상승률 변동폭 (±%p). 2.3% 기준 1.6%~3.0% 구간을 본다.
  # source: 한국은행 물가안정목표 2.0% ± 최근 10년 소비자물가 상승률의 변동 범위
  inflation_delta: 0.007

  # 기대수익률 변동폭 (±%p, 전 자산군 동시 이동).
  # source: 장기 기대수익률 추정의 통상적 불확실성 폭
  return_delta: 0.010

  # 월 생활비 오차 (±비율). 사용자가 스스로 답한 값이라 실제와 벌어지기 쉽다.
  # source: 가계동향조사 기준 은퇴가구 소비지출의 조사-실지출 괴리 수준을 보수적으로 반영
  expense_ratio: 0.10

  # 국민연금 예상 수령액 오차 (±비율). 공단 조회 없이 기억에 의존한 답이 많다.
  pension_ratio: 0.10

  # 금융자산 평가액 오차 (±비율). 평가 시점과 반올림 차이.
  assets_ratio: 0.10

# ---------------------------------------------------------------------------
# 자산지도(기능 ②) 버킷 산정 기준
# ---------------------------------------------------------------------------
asset_map:
  # 생존자산 = 월 생활비 x 이 개월 수 (즉시 인출 가능해야 하는 비상 현금)
  survival_months: 12
