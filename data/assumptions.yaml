# 시뮬레이션 가정값
#
# 여기 있는 모든 숫자는 "가정"이다. 심사·발표에서 근거를 물을 수 있으므로
# 값을 추가하거나 바꿀 때는 반드시 source 주석을 함께 남긴다.
# 이 파일은 core/assumptions.py 를 통해서만 읽는다.

version: "2026-08-13"

# ---------------------------------------------------------------------------
# 거시 가정
# ---------------------------------------------------------------------------
macro:
  # 물가상승률 — 생활비를 매년 이 비율로 증가시킨다.
  # source: 한국은행 물가안정목표 2.0% + 최근 10년 소비자물가 상승률 평균을 반영한 보수적 값
  inflation_rate: 0.023

  # 시뮬레이션 종료 나이. 통계청 기대여명 대비 보수적으로 길게 잡는다.
  # source: 통계청 생명표 기준 60세 남성 기대여명 + 안전마진
  horizon_age: 95

# ---------------------------------------------------------------------------
# 자산군별 기대수익률 / 변동성 (연율, 명목)
#   expected_return: 결정론적 시뮬레이션에서 사용
#   volatility     : 몬테카를로(W2)에서 사용
# ---------------------------------------------------------------------------
asset_classes:
  cash:
    label: "현금성(예적금·MMF)"
    expected_return: 0.030 # source: 시중은행 1년 정기예금 금리 수준
    volatility: 0.004
  bond:
    label: "채권·중위험"
    expected_return: 0.038 # source: 국고채 3년 + 신용스프레드 근사
    volatility: 0.045
  equity:
    label: "주식·ETF·펀드"
    expected_return: 0.070 # source: 글로벌 주식 장기 명목수익률 보수 추정
    volatility: 0.170

# ---------------------------------------------------------------------------
# 세금 — MVP는 실효세율 근사만 사용한다 (정밀 계산은 범위 밖, 화면에 참고용 고지 필수)
# ---------------------------------------------------------------------------
tax:
  # 이자·배당소득 원천징수 실효세율 (소득세 14% + 지방소득세 1.4%)
  # source: 소득세법 제129조
  financial_income_rate: 0.154

  # 금융소득종합과세 기준금액. 초과분에 대한 누진 효과는 MVP에서 반영하지 않는다.
  # source: 소득세법 제14조
  comprehensive_threshold: 20000000

# ---------------------------------------------------------------------------
# 건강보험료
#
# 두 가지 용도로 쓴다. **섞으면 같은 부담을 두 번 세게 되므로** 구분해 둔다.
#
#   (1) effective_rate_on_financial_income · exemption_threshold
#       캐시플로우 엔진이 매년 금융소득에 얹는 **실효 부담률 근사**.
#       화면 전체의 기본 계산이 이것을 쓴다.
#
#   (2) dependent · local · voluntary
#       퇴직 후 피부양자 절벽을 **제도 구조 그대로** 따지는 값들
#       (core/health_insurance.py). 이쪽을 계산할 때는 (1)을 빼고 돌린다.
# ---------------------------------------------------------------------------
health_insurance:
  # 금융소득에 부과되는 실효 부담률 근사 (건강보험료율 + 장기요양보험료 포함)
  # source: 국민건강보험법 시행령 보험료율 기준 근사
  effective_rate_on_financial_income: 0.080

  # 이 금액 이하의 연간 금융소득에는 부과하지 않는다.
  # source: 건강보험료 부과 대상 금융소득 기준
  exemption_threshold: 10000000

  # --- 피부양자 자격 요건 -------------------------------------------------
  # 퇴직 후 직장 다니는 배우자·자녀의 피부양자로 들어가면 보험료가 **0원**이다.
  # 요건을 하나라도 넘기면 지역가입자가 되어 연 수백만원이 생긴다. 절벽이다.
  #
  # ⚠️ 아래 기준금액은 **원문(국민건강보험법 시행규칙 별표 1의2)으로 재확인할 것.**
  #    발표에서 이 숫자를 그대로 말하게 된다.
  dependent:
    # 연간 합산소득 한도. 넘으면 탈락한다.
    income_limit: 20000000

    # 금융소득은 이 금액 **이하면 합산에서 아예 빠지고, 넘으면 전액이 들어간다.**
    # 1원 차이로 합산소득이 1,000만원 넘게 뛴다 — 이 기능이 존재하는 이유다.
    financial_income_limit: 10000000

    # 재산세 과세표준 한도. 이 금액을 넘으면 소득과 무관하게 탈락한다.
    property_limit: 540000000

    # 완충 구간 — 과세표준이 여기를 넘으면 소득 기준이 1,000만원으로 강화된다.
    property_soft_limit: 360000000
    soft_limit_income_limit: 10000000

  # --- 지역가입자 보험료 ---------------------------------------------------
  # ⚠️ 요율은 매년 바뀐다. 발표 전 공단 공지로 재확인할 것.
  local:
    # 건강보험료율 (지역가입자 소득분은 2024년부터 점수제 없이 정률 부과)
    # source: 국민건강보험법 시행령 제44조
    health_rate: 0.0709

    # 장기요양보험료율 — 건강보험료 대비
    # source: 노인장기요양보험법 시행령 제4조
    long_term_care_rate: 0.1295

    # 공적연금소득은 보험료 부과 시 50%만 반영된다.
    # (피부양자 자격 판정에서는 전액 반영된다 — 같은 소득인데 기준이 다르다.)
    pension_income_share: 0.50

    # 소득·재산이 적어도 이 금액은 부과된다.
    minimum_monthly: 19780

  # --- 임의계속가입 --------------------------------------------------------
  # 퇴직 직후의 완충장치. 직장가입자 시절 보험료(본인부담분)를 최대 36개월 유지한다.
  # source: 국민건강보험법 제110조
  voluntary:
    max_months: 36
    # 직장가입자 보험료의 본인부담 비율 (나머지 절반은 회사가 냈다)
    employee_share: 0.50
    # 퇴직 전 18개월 동안 직장가입자 자격이 통산 이 기간 이상이어야 한다.
    min_service_years: 1

  # 부동산 시가 → 재산세 과세표준 근사 (공시가격 비율 0.70 × 공정시장가액비율 0.60).
  # 두 단계 근사가 겹쳐 있어 경계 근처에서는 믿을 수 없다. 화면에서 그렇게 말한다.
  # source: 지방세법 제110조, 부동산 공시가격 현실화 계획
  property_tax_base_ratio: 0.42

# ---------------------------------------------------------------------------
# 연금
# ---------------------------------------------------------------------------
pension:
  # 출생연도별 국민연금 노령연금 수급 개시 연령 (법정 스케줄).
  # from_birth_year 이상인 구간의 age 를 적용한다.
  # source: 국민연금법 부칙 제8조 (수급연령 단계적 상향)
  start_age_schedule:
    - { from_birth_year: 0, age: 60 }
    - { from_birth_year: 1953, age: 61 }
    - { from_birth_year: 1957, age: 62 }
    - { from_birth_year: 1961, age: 63 }
    - { from_birth_year: 1965, age: 64 }
    - { from_birth_year: 1969, age: 65 }

  # 국민연금 수령액의 물가연동 여부. 실제로 국민연금은 물가에 연동된다.
  # source: 국민연금법 제51조의2
  indexed_to_inflation: true

  # 수급 시기를 법정 개시연령에서 앞당기거나 미룰 때의 수령액 조정률.
  # 소득공백기 문제에 대한 가장 직접적인 레버라서 처방 엔진(core/prescribe.py)이 쓴다.
  #
  # 연기연금: 1개월당 0.6% 가산 = 연 7.2%, 최대 5년(36%)
  #   source: 국민연금법 제62조(연기연금) — 시행령 원문으로 재확인할 것
  # 조기노령연금: 1년당 6% 감액, 최대 5년(30%)
  #   source: 국민연금법 제61조(조기노령연금) — 시행령 원문으로 재확인할 것
  #
  # ⚠️ 조기 수령의 감액은 평생 유지된다. 화면에서 이 점을 반드시 함께 말해야 한다.
  deferral_rate_per_year: 0.072
  early_rate_per_year: 0.060
  max_adjust_years: 5

# ---------------------------------------------------------------------------
# 국민연금 임의계속가입 · 추후납부(추납)
#
# 연기·조기가 "언제 받을까"의 레버라면 이쪽은 **"얼마나 쌓았나"의 레버**다.
# 가입기간이 부족한 사람에게는 앞의 레버가 아무 의미가 없다 — 받을 연금 자체가
# 없기 때문이다.
#
# ⚠️ 이 항목은 건강보험 피부양자 절벽과 정면으로 부딪힌다. 연금을 늘리면
#    합산소득이 올라 피부양자에서 더 빨리 탈락한다. 한쪽만 계산해서 권하면
#    "연금 늘리세요"가 실제로는 손해인 구간을 놓친다.
# ---------------------------------------------------------------------------
national_pension:
  # 보험료율. 직장가입자는 회사와 절반씩 냈지만 임의계속가입·추납은 **전액 본인 부담**이다.
  # source: 국민연금법 제88조 제3항
  contribution_rate: 0.09

  # 노령연금 수급 최소 가입기간(월).
  # **119개월과 120개월은 연속적이지 않다.** 119개월이면 평생 연금이 0원이고
  # 반환일시금만 받는다. 1개월 차이로 결과가 갈리는 또 하나의 계단이다.
  # source: 국민연금법 제61조 제1항
  min_months: 120

  # 의무가입 상한 연령. 이 나이가 되면 보험료를 더 낼 수 없다 —
  # 임의계속가입을 신청하지 않는 한.
  # source: 국민연금법 제6조
  contribution_age_limit: 60

  # 임의계속가입으로 가입을 이어갈 수 있는 상한 연령.
  # 다만 **노령연금 수급권을 취득하면 자격이 상실된다.** 수급 개시가 64세인
  # 사람은 65세가 아니라 64세까지만 쓸 수 있다 — 이 제약을 코드에 넣는다.
  # source: 국민연금법 제13조
  voluntary_max_age: 65

  # 추납 상한 개월수. 2020년 12월 개정으로 119개월로 제한되었다.
  # (그전에는 상한이 없어 수십 년치를 한 번에 넣는 사례가 있었다.)
  # source: 국민연금법 제92조 제3항
  max_catchup_months: 119

  # 추납 보험료 분할납부 최대 횟수. 목돈이 부담되면 나눠 낼 수 있다.
  # source: 국민연금법 시행령 제73조의2
  max_installments: 60

  # 기본연금액 산식의 가입기간 계수 — 20년(240개월)을 1.0으로 두고
  # 초과 1년당 5% 가산, 미달 1년당 5% 감액한다.
  #
  #   계수 = 1 + 0.05 × (가입월수 - 240) ÷ 12
  #
  # 10년(120개월) 가입은 0.5, 40년(480개월) 가입은 2.0이 된다.
  # 이 서비스는 사용자가 알려준 **공단 예상연금액을 기준점(anchor)으로** 삼고
  # 이 계수의 비율만 쓴다. A값·B값을 지어내지 않기 위해서다.
  # source: 국민연금법 제51조 및 별표 1
  base_months: 240
  accrual_per_year: 0.05

  # 기준소득월액 상한·하한. 보험료는 이 범위 안에서만 매겨진다.
  # 급여가 상한을 넘어도 보험료는 상한까지만 낸다.
  #
  # ⚠️ **매년 7월 조정된다.** 발표 전 공단 공지로 재확인할 것.
  #    아래는 2024년 7월 ~ 2025년 6월 적용값이다.
  # source: 보건복지부 고시 기준소득월액 상·하한액
  income_base_max: 6_170_000
  income_base_min: 390_000

# ---------------------------------------------------------------------------
# 퇴직소득세 — 퇴직금을 일시금으로 받을지 연금으로 받을지 비교하는 데 쓴다.
#
# 이 서비스에서 유일하게 "실효세율 근사"가 아니라 **제도의 계산 구조를 그대로**
# 따라가는 세금이다. 퇴직소득세는 근속연수공제가 매우 커서 실효세율이 1~5%로
# 낮은데, 평균 세율 하나로 뭉개면 "장기근속자는 퇴직소득세가 거의 없다"는
# 중요한 사실이 사라진다. 타겟(30년 안팎 근속 후 퇴직)에게는 그게 핵심이다.
#
# 계산 순서 (소득세법 제48조·제55조):
#   환산급여 = (퇴직급여 - 근속연수공제) ÷ 근속연수 × 12
#   과세표준 = 환산급여 - 환산급여공제
#   산출세액 = 과세표준 × 기본세율 ÷ 12 × 근속연수   (연분연승법)
#
# ⚠️ 아래 구간·금액은 **원문(소득세법 및 시행령)으로 반드시 재확인할 것.**
#    발표에서 이 표를 그대로 띄우게 된다.
# ---------------------------------------------------------------------------
retirement_income_tax:
  # 근속연수공제 — 구간별 기본공제액 + 초과 1년당 가산액 (원)
  # source: 소득세법 제48조 제1항
  service_deduction:
    - { over_years: 0, base: 0, per_year: 1_000_000 }
    - { over_years: 5, base: 5_000_000, per_year: 2_000_000 }
    - { over_years: 10, base: 15_000_000, per_year: 2_500_000 }
    - { over_years: 20, base: 40_000_000, per_year: 3_000_000 }

  # 환산급여공제 — 구간별 기본공제액 + 초과분 공제율
  # source: 소득세법 제48조 제3항
  converted_deduction:
    - { over: 0, base: 0, rate: 1.00 }
    - { over: 8_000_000, base: 8_000_000, rate: 0.60 }
    - { over: 70_000_000, base: 45_200_000, rate: 0.55 }
    - { over: 100_000_000, base: 61_700_000, rate: 0.45 }
    - { over: 300_000_000, base: 151_700_000, rate: 0.35 }

  # 종합소득 기본세율 (누진). 퇴직소득세도 이 세율표를 쓴다.
  # source: 소득세법 제55조
  brackets:
    - { over: 0, rate: 0.06 }
    - { over: 14_000_000, rate: 0.15 }
    - { over: 50_000_000, rate: 0.24 }
    - { over: 88_000_000, rate: 0.35 }
    - { over: 150_000_000, rate: 0.38 }
    - { over: 300_000_000, rate: 0.40 }
    - { over: 500_000_000, rate: 0.42 }
    - { over: 1_000_000_000, rate: 0.45 }

  # 지방소득세 (소득세액의 10%)
  # source: 지방세법 제92조
  local_tax_rate: 0.10

  # IRP 등으로 연금 수령 시 퇴직소득세 감면율.
  # 수령 10년차까지 30%, 11년차부터 40% 감면된다.
  # source: 소득세법 제129조 제1항 제5호의3
  pension_discount: 0.30
  pension_discount_after: 0.40
  pension_discount_after_years: 10

  # 연금으로 받을 때의 기본 수령 기간(년). 화면에서 조정할 수 있다.
  default_pension_years: 10

# ---------------------------------------------------------------------------
# 민감도 분석 — 이 가정들이 틀렸을 때 결과가 얼마나 흔들리는지 보여준다.
#
# 심사·발표에서 "그 가정이 틀리면요?"는 반드시 나오는 질문이다. 답을 준비하는
# 것보다 **화면에 미리 띄워두는 편**이 낫다. 여기 값은 "얼마나 틀릴 수 있는가"의
# 폭이며, 가정값 자체와 마찬가지로 근거가 필요하다.
# ---------------------------------------------------------------------------
sensitivity:
  # 물가상승률 변동폭 (±%p). 2.3% 기준 1.6%~3.0% 구간을 본다.
  # source: 한국은행 물가안정목표 2.0% ± 최근 10년 소비자물가 상승률의 변동 범위
  inflation_delta: 0.007

  # 기대수익률 변동폭 (±%p, 전 자산군 동시 이동).
  # source: 장기 기대수익률 추정의 통상적 불확실성 폭
  return_delta: 0.010

  # 월 생활비 오차 (±비율). 사용자가 스스로 답한 값이라 실제와 벌어지기 쉽다.
  # source: 가계동향조사 기준 은퇴가구 소비지출의 조사-실지출 괴리 수준을 보수적으로 반영
  expense_ratio: 0.10

  # 국민연금 예상 수령액 오차 (±비율). 공단 조회 없이 기억에 의존한 답이 많다.
  pension_ratio: 0.10

  # 금융자산 평가액 오차 (±비율). 평가 시점과 반올림 차이.
  assets_ratio: 0.10

# ---------------------------------------------------------------------------
# 자산지도(기능 ②) 버킷 산정 기준
# ---------------------------------------------------------------------------
asset_map:
  # 생존자산 = 월 생활비 x 이 개월 수 (즉시 인출 가능해야 하는 비상 현금)
  survival_months: 12
