# 정책·제도 팩트시트 (기능 ④·⑧의 축소판)
#
# 기획서의 정책 RAG 는 문서 수집과 시점 관리가 별도 프로젝트급이라 MVP 범위 밖이다.
# 대신 사기 탐지에서 "제도가 바뀌었으니 갈아타라"는 주장을 대조할 최소한의 사실만 둔다.
#
# `impact` 블록이 있는 항목은 **실제 계산에 연결된다** (core/policy.py).
# 뉴스 요약으로 끝내지 않고 "고객님 자산 기준으로 연 ○○원"까지 내려가는 것이
# 이 기능의 존재 이유다. 지금은 ISA 세제 개편안 한 건만 연결돼 있다.
#
# **status 가 이 파일의 핵심이다.** 기획서가 지적한 대로, 일반 뉴스는 "발표"와 "시행"을
# 구분하지 않는다. 발표된 개편안이 그대로 확정되지 않는 경우도 많다.
#   발표 → 입법예고 → 국회통과 → 공포 → 시행
#
# ⚠️ 여기 있는 내용은 **예시 데이터**다. 발표에 쓰기 전에 반드시 원문으로 최신화할 것.
#    각 항목의 source 와 checked_at 을 근거로 삼는다.

version: "2026-08-13"

facts:
  - key: isa_reform
    topic: ISA
    title: ISA 세제 개편 논의
    status: 발표
    effective_date: null
    source: 기획재정부 세법개정안 (원문 확인 필요)
    checked_at: "2026-08-13"
    summary: >-
      ISA 납입한도와 비과세 한도 조정이 논의되고 있습니다.
    caution: >-
      아직 확정되지 않았습니다. 국회 논의 과정에서 내용이 바뀌거나 무산될 수 있으므로,
      이를 근거로 지금 상품을 옮기실 필요는 없습니다.
    # ------------------------------------------------------------------ #
    # 영향 계산 파라미터 (core/policy.py 의 isa_tax 모델이 읽는다)
    #
    # ⚠️ 아래 숫자도 **예시 값**이다. 원문(기재부 세법개정안)으로 확인 후 갱신할 것.
    #
    # 현행 ISA: 계약기간(의무가입 3년) 동안 발생한 이자·배당 소득 중 일반형 200만원까지
    # 비과세, 초과분은 9.9% 분리과세. 분리과세된 소득은 금융소득종합과세에서 빠지므로
    # 건강보험료 산정에도 반영되지 않는다.
    #
    # 이 엔진은 연 단위로 돌기 때문에 계약기간 총액 한도를 contract_years 로 나눠
    # 연 환산해 쓴다. 한도를 연 단위로 다시 채운다고 보면 실제보다 유리해지므로,
    # 총액을 나누는 쪽이 보수적이다.
    # ------------------------------------------------------------------ #
    impact:
      kind: isa_tax
      # 연 환산 절감액이 이 금액 미만이면 "상품을 옮길 이유가 되지 않는다"고 판정한다.
      # 근거: 월 생활비 300만원 기준으로 한 달 생활비의 약 1/6 수준이면 의사결정을
      # 바꿀 만한 크기가 아니라고 봤다. 값을 조정할 때는 이 문장도 함께 고칠 것.
      materiality_threshold: 500000
      current:
        label: 현행 제도
        exempt_limit_total: 2000000 # 일반형 비과세 한도 (계약기간 총액)
        contract_years: 3 # ISA 의무가입기간
        separate_rate: 0.099 # 한도 초과분 분리과세율 (지방소득세 포함)
      proposed:
        label: 개편안 (미확정)
        exempt_limit_total: 5000000
        contract_years: 3
        separate_rate: 0.099

  - key: pension_start_age
    topic: 연금
    title: 국민연금 수급 개시 연령 단계적 상향
    status: 시행
    effective_date: "2013-01-01"
    source: 국민연금법 부칙 제8조
    checked_at: "2026-08-13"
    summary: >-
      출생연도에 따라 수급 개시 연령이 60세에서 65세까지 단계적으로 올라갑니다.
      1961~64년생 63세, 1965~68년생 64세, 1969년생 이후 65세입니다.
    caution: >-
      이미 시행 중인 확정된 제도입니다. 이 서비스의 소득공백기 계산에 반영되어 있습니다.

  - key: deposit_protection
    topic: 예금자보호
    title: 예금자보호 한도
    status: 시행
    effective_date: null
    source: 예금자보호법
    checked_at: "2026-08-13"
    summary: >-
      1인당 금융회사별로 원금과 이자를 합해 5,000만원까지 보호됩니다.
    caution: >-
      투자상품(펀드, 주식, ELS 등)은 예금자보호 대상이 아닙니다.
      "원금 보장"을 말하는 상품이 실제로 보호 대상인지 반드시 확인하세요.

  - key: health_insurance_financial_income
    topic: 건강보험료
    title: 금융소득에 대한 건강보험료 부과
    status: 시행
    effective_date: null
    source: 국민건강보험법 시행령
    checked_at: "2026-08-13"
    summary: >-
      일정 금액을 넘는 금융소득은 지역가입자 건강보험료 산정에 반영됩니다.
    caution: >-
      이 서비스의 계산은 실효 부담률 근사치입니다. 실제 보험료는 재산·소득 전반을
      반영해 산정되므로 공단 확인이 필요합니다.
