# 금융사기·불완전판매 레드플래그 (기능 ⑦)
#
# 이 규칙은 LLM 없이도 동작한다. 룰이 먼저 근거를 잡고, LLM 은 문맥을 덧붙인다.
# 규칙 기반이라 "왜 위험하다고 판단했는지"를 사용자에게 그대로 보여줄 수 있다.
#
# match.all : 나열된 모든 그룹에서 최소 하나씩 걸려야 발동 (동시 등장이 핵심인 신호)
# match.any : 나열된 낱말 중 하나만 걸려도 발동
#
# severity: high(단독으로 위험) / medium(둘 이상이면 위험) / low(참고)
#
# 주의: 이 목록은 사기 여부를 확정하지 않는다. "확인이 필요한 신호"를 알릴 뿐이다.
# 정상적인 금융상품 안내도 일부 표현이 걸릴 수 있으므로 문구를 단정적으로 쓰지 않는다.

version: "2026-08-13"

rules:
  - key: guaranteed_high_return
    label: 원금 보장과 고수익을 동시에 강조
    severity: high
    why: >-
      원금이 보장되면서 높은 수익이 나는 금융상품은 없습니다.
      예금자보호는 1인당 금융회사별 5,000만원까지이며, 그 밖의 투자상품은 원금을 잃을 수 있습니다.
    advice: 원금 보장과 고수익을 함께 말한다면 일단 멈추시고, 거래하시는 은행에 직접 문의하세요.
    match:
      all:
        - [원금 보장, 원금보장, 원금손실 없, 손실 없, 절대 안전, 확정 수익, 확정수익]
        # 숫자가 끼는 표현은 정규식으로 잡는다 ("월 %"로는 "월 3%"를 못 잡는다)
        - [고수익, 고금리, 수익률, 두 배, 대박, 확정 수익, 확정수익,
           "re:월\\s*\\d+(?:\\.\\d+)?\\s*%", "re:연\\s*\\d+(?:\\.\\d+)?\\s*%"]

  - key: unrealistic_return
    label: 현실적이지 않은 수익률 제시
    severity: high
    why: >-
      원금이 보장되지 않는 상품이라도 월 단위로 높은 수익을 확정해 약속하는 것은
      정상적인 금융상품에서 나올 수 없는 조건입니다.
    advice: 제시된 수익률을 금융감독원 파인(fine.fss.or.kr)에서 상품 공시와 비교해 보세요.
    match:
      any:
        # 월 2% 이상(연 24% 이상) 또는 연 20% 이상을 확정처럼 제시하는 경우
        - "re:월\\s*(?:[2-9](?:\\.\\d+)?|\\d{2,})\\s*%"
        - "re:연\\s*(?:[2-9]\\d|\\d{3,})(?:\\.\\d+)?\\s*%"
        - 원금의 2배
        - 배로 불려
        - 두 배로

  - key: urgency
    label: 즉시 결정하도록 재촉
    severity: high
    why: >-
      정상적인 금융상품은 충분히 검토할 시간을 줍니다.
      생각할 시간을 주지 않는 것은 판단을 흐리게 하려는 대표적인 수법입니다.
    advice: 오늘 결정하지 않아도 됩니다. 최소 하루는 두고 가족이나 은행과 상의하세요.
    match:
      any:
        [
          오늘까지,
          오늘 마감,
          마감 임박,
          마감임박,
          선착순,
          지금 아니면,
          지금 안 하시면,
          서둘러,
          곧 종료,
          한정,
          마지막 기회,
        ]

  - key: unofficial_channel
    label: 공식 창구가 아닌 경로로 유도
    severity: high
    why: >-
      금융회사는 카카오톡이나 텔레그램 개인 대화, 개인 계좌 이체로 가입을 진행하지 않습니다.
      링크를 통한 앱 설치 요구는 특히 위험합니다.
    advice: 어떤 링크도 누르지 마시고, 반드시 은행 앱이나 영업점 창구로 직접 확인하세요.
    match:
      any:
        [
          텔레그램,
          오픈채팅,
          개인 계좌,
          개인계좌,
          이 링크,
          링크 클릭,
          앱 설치,
          앱을 설치,
          원격,
          비밀번호,
          인증번호,
          OTP,
        ]

  - key: impersonation
    label: 공공기관·금융회사 사칭 정황
    severity: high
    why: >-
      금융감독원, 금융위원회, 국민연금공단 등은 특정 금융상품의 가입을 권유하지 않습니다.
      기관 이름을 앞세워 상품을 권한다면 사칭일 가능성이 높습니다.
    advice: 해당 기관 대표번호로 직접 전화해 확인하세요. 상대가 알려준 번호는 쓰지 마세요.
    match:
      all:
        - [금융감독원, 금감원, 금융위원회, 국민연금공단, 검찰, 경찰, 국세청, 정부기관]
        - [가입, 이체, 송금, 갈아타, 계좌, 상품]

  - key: policy_pretext
    label: 제도 변경을 근거로 즉시 갈아타기를 권유
    severity: medium
    why: >-
      제도 변경은 대개 예고 기간과 시행일이 있고, 발표된 개편안이 그대로 확정되지 않는 경우도 많습니다.
      "제도가 바뀌니 지금 옮겨야 한다"는 권유는 사실관계 확인이 필요합니다.
    advice: 언급된 제도가 실제로 확정·시행되었는지 공식 발표로 확인한 뒤 판단하세요.
    match:
      all:
        - [세법, 세제, 제도, 개편, 정책, 법이 바뀌, 규정이 바뀌, 폐지, 비과세 혜택]
        - [갈아타, 옮기, 해지, 지금 가입, 서둘러, 이전, 전환]

  - key: secrecy
    label: 비밀 유지나 특별 대우를 강조
    severity: medium
    why: >-
      가족이나 은행에 알리지 말라는 요구는 검증을 막으려는 신호입니다.
      정상적인 금융거래에는 숨길 이유가 없습니다.
    advice: 아무에게도 말하지 말라는 말이 나오면 그 자체로 멈추셔야 할 이유입니다.
    match:
      any: [비밀, 말하지 마, 알리지 마, 아무한테도, VIP 전용, 특별히, 소수에게만, 몰래]

  - key: unverifiable_claim
    label: 확인할 수 없는 실적이나 후기를 근거로 제시
    severity: medium
    why: >-
      수익 인증 화면이나 후기는 얼마든지 만들 수 있습니다.
      금융회사의 공식 공시가 아닌 자료는 근거가 되지 않습니다.
    advice: 회사명과 상품명으로 금융감독원 파인에서 등록 여부를 조회해 보세요.
    match:
      any: [수익 인증, 인증샷, 후기, 회원님들, 저희 회원, 실제로 벌었, 이미 많은 분]

  - key: unregistered_entity
    label: 등록되지 않은 업체일 가능성
    severity: medium
    why: >-
      제도권 금융회사가 아니면 예금자보호도, 분쟁조정도 받을 수 없습니다.
    advice: 금융감독원 파인에서 제도권 금융회사인지 먼저 확인하세요.
    match:
      any: [투자자문, 리딩방, 자문사, 사설, 해외 법인, 코인, 가상자산, P2P, 사모]

# 제도·세제 관련 주장이 등장하면 공식 정보와 대조가 필요하다는 신호.
# data/policy_facts.yaml 의 항목과 연결된다.
policy_topics:
  ISA: [ISA, 아이에스에이, 개인종합자산관리]
  연금: [국민연금, 연금저축, 퇴직연금, IRP, 노령연금]
  건강보험료: [건강보험료, 건보료, 지역가입자, 피부양자]
  금융소득과세: [금융소득, 종합과세, 이자소득세, 배당소득세, 분리과세]
